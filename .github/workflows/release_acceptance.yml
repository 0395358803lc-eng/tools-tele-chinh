name: Release Acceptance

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  packaged-windows-release:
    name: Build and boot packaged Windows ZIP
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.lock

      - name: Create backend virtual environment
        shell: pwsh
        run: |
          python -m venv backend/.venv
          .\backend\.venv\Scripts\python.exe -m pip install --upgrade pip
          .\backend\.venv\Scripts\python.exe -m pip install -r backend/requirements.lock

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.12"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build sanitized release
        shell: pwsh
        run: .\build_release.ps1

      - name: Locate release archive
        id: archive
        shell: pwsh
        run: |
          $zip = Get-ChildItem -LiteralPath release -Filter "*.zip" | Select-Object -First 1
          if (-not $zip) { throw "Release zip was not produced" }
          "path=$($zip.FullName)" >> $env:GITHUB_OUTPUT
          "name=$($zip.Name)" >> $env:GITHUB_OUTPUT

      - name: Validate and boot packaged release
        shell: pwsh
        run: |
          .\validate_release.ps1 -ZipPath "${{ steps.archive.outputs.path }}" -PythonPath ".\backend\.venv\Scripts\python.exe"

      - name: Upload accepted release
        uses: actions/upload-artifact@v4
        with:
          name: accepted-${{ steps.archive.outputs.name }}
          path: ${{ steps.archive.outputs.path }}
          if-no-files-found: error
