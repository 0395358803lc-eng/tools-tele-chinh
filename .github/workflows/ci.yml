name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests (Python ${{ matrix.python-version }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/requirements.lock

      - name: Install exact backend dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.lock

      - name: Verify backend dependency lock
        working-directory: backend
        run: python check_requirements.py

      - name: Check backend dependency compatibility
        run: python -m pip check

      - name: Run backend tests
        working-directory: backend
        run: python -m unittest discover -s tests -v

      - name: Run scheduler soak smoke
        working-directory: backend
        run: python soak_scheduler.py --seconds 1 --accounts 100 --actions-per-account 2

  frontend:
    name: Frontend audit and build
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.12"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Audit high and critical vulnerabilities
        working-directory: frontend
        run: npm audit --audit-level=high

      - name: Run frontend regression tests
        working-directory: frontend
        run: npm test

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Verify bundled frontend
        shell: pwsh
        run: |
          if (-not (Test-Path -LiteralPath "backend/static/index.html")) {
            throw "backend/static/index.html was not produced"
          }

      - name: Upload bundled frontend
        uses: actions/upload-artifact@v4
        with:
          name: frontend-static
          path: backend/static
          if-no-files-found: error

  runtime-smoke:
    name: Real Windows runtime smoke
    runs-on: windows-latest
    needs: [backend, frontend]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.lock

      - name: Install exact backend dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.lock
          python -m pip check

      - name: Restore bundled frontend
        uses: actions/download-artifact@v4
        with:
          name: frontend-static
          path: backend/static

      - name: Run real application smoke test
        working-directory: backend
        run: python tests/runtime_smoke.py

      - name: Upload runtime log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-smoke-log
          path: runtime-smoke-uvicorn.log
          if-no-files-found: ignore
