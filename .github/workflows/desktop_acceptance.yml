name: Windows Desktop Acceptance

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop-windows-x64:
    name: Build and smoke Windows desktop EXEs
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.lock
            desktop/requirements-build.txt

      - name: Create backend virtual environment
        shell: pwsh
        run: |
          python -m venv backend/.venv
          .\backend\.venv\Scripts\python.exe -m pip install --upgrade pip
          .\backend\.venv\Scripts\python.exe -m pip install -r backend/requirements.lock

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.12"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build Windows desktop artifacts
        shell: pwsh
        run: .\build_desktop.ps1

      - name: Locate desktop artifacts
        id: artifacts
        shell: pwsh
        run: |
          $portable = Get-ChildItem -LiteralPath release-desktop -Filter "MultiTGManager-Portable-*-x64.exe" | Select-Object -First 1
          $installer = Get-ChildItem -LiteralPath release-desktop -Filter "MultiTGManager-Setup-*-x64.exe" | Select-Object -First 1
          if (-not $portable) { throw "Portable desktop EXE was not produced" }
          if (-not $installer) { throw "Installer desktop EXE was not produced" }
          "portable=$($portable.FullName)" >> $env:GITHUB_OUTPUT
          "installer=$($installer.FullName)" >> $env:GITHUB_OUTPUT

      - name: Smoke portable desktop executable
        shell: pwsh
        run: |
          $runtime = Join-Path $env:RUNNER_TEMP "mtm-desktop-smoke"
          if (Test-Path -LiteralPath $runtime) {
            Remove-Item -LiteralPath $runtime -Recurse -Force
          }
          $env:MTM_RUNTIME_ROOT = $runtime
          $process = Start-Process -FilePath "${{ steps.artifacts.outputs.portable }}" -ArgumentList "--smoke-test" -PassThru
          try {
            Wait-Process -Id $process.Id -Timeout 120 -ErrorAction Stop
          } catch {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            $log = Join-Path $runtime "data\logs\app.log"
            if (Test-Path -LiteralPath $log) { Get-Content -LiteralPath $log }
            throw "Portable desktop smoke timed out after 120 seconds"
          }
          $process.Refresh()
          if ($process.ExitCode -ne 0) {
            $log = Join-Path $runtime "data\logs\app.log"
            if (Test-Path -LiteralPath $log) { Get-Content -LiteralPath $log }
            throw "Portable desktop smoke failed with exit code $($process.ExitCode)"
          }

      - name: Validate desktop artifact sizes
        shell: pwsh
        run: |
          foreach ($path in @("${{ steps.artifacts.outputs.portable }}", "${{ steps.artifacts.outputs.installer }}")) {
            $file = Get-Item -LiteralPath $path
            if ($file.Length -lt 5MB) {
              throw "Desktop artifact is unexpectedly small: $($file.FullName)"
            }
            Write-Host "$($file.Name): $([math]::Round($file.Length / 1MB, 1)) MB"
          }

      - name: Upload accepted desktop artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-desktop-x64
          path: |
            ${{ steps.artifacts.outputs.portable }}
            ${{ steps.artifacts.outputs.installer }}
          if-no-files-found: error
